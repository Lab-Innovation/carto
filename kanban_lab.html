<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Projets – Lab Innovation</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js" onerror="window._noGrist=true"></script>
<style>

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --col-w: 160px;
  --lane-w: 130px;
  --header-h: 50px;
  --bar-h: 46px;

  --navy:       #1B2A4A;
  --navy-mid:   #243659;
  --navy-light: #2E4470;
  --border:     #D4DEED;
  --bg:         #EBF0F6;
  --bg-cell:    #F4F7FB;
  --surface:    #FFFFFF;

  --text:       #0F1923;
  --text-mid:   #3D4E66;
  --text-muted: #7A90AA;
  --text-faint: #A8BCCC;

  /* Lane accents — palette extraite de l'image de référence */
  --rd:   #8D3F86;   /* R&D — mauve */
  --poc:  #2D6A98;   /* POC — bleu */
  --pil:  #7A6422;   /* Pilote — or */
  --ind:  #1D6E62;   /* Industrialisation — sarcelle */

  /* Status accents */
  --s-backlog:  #94A3B8;
  --s-afaire:   #3B82F6;
  --s-encours:  #F97316;
  --s-pause:    #EC4899;
  --s-termine:  #84CC16;
  --s-ecarte:   #EF4444;

  --radius:   6px;
  --radius-sm:3px;
  --shadow:   0 1px 2px rgba(15,25,35,.08), 0 1px 6px rgba(15,25,35,.04);
  --shadow-up:0 4px 18px rgba(15,25,35,.13);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ─────────────────────────────────────────────── */
.bar {
  height: var(--bar-h);
  background: var(--navy);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  flex-shrink: 0;
}
.bar-title {
  font-size: 12px;
  font-weight: 700;
  color: #D6E1F0;
  letter-spacing: .02em;
}
.bar-dot { width: 3px; height: 3px; border-radius: 50%; background: #3D5070; }
.bar-count {
  font-size: 11px;
  color: #7A90AA;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 3px;
  padding: 1px 7px;
}
.bar-mode {
  margin-left: auto;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: 600;
  letter-spacing: .03em;
}
.bar-mode.connected { background: rgba(16,185,129,.15); color: #6EE7B7; }
.bar-mode.demo      { background: rgba(245,158,11,.12);  color: #FCD34D; }

/* Lane legend */
.bar-lanes {
  display: flex;
  gap: 8px;
  margin-left: 8px;
}
.bar-lane {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #7A90AA;
  font-weight: 500;
}
.bar-lane-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}

/* ── Board scroll container ──────────────────────────────── */
.scroll {
  flex: 1;
  overflow: auto;
  position: relative;
}

/* ── Board grid ──────────────────────────────────────────── */
.board {
  display: grid;
  grid-template-columns: var(--lane-w) repeat(6, minmax(var(--col-w), 1fr));
  width: 100%;
  min-width: calc(var(--lane-w) + 6 * var(--col-w));
}

/* ── Header row ──────────────────────────────────────────── */
.corner {
  position: sticky;
  top: 0; left: 0;
  z-index: 20;
  background: var(--navy);
  height: var(--header-h);
  border-right: 1px solid rgba(255,255,255,.06);
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.col-hd {
  position: sticky;
  top: 0;
  z-index: 10;
  height: var(--header-h);
  background: var(--navy-mid);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 8px;
  border-right: 1px solid rgba(255,255,255,.05);
  border-bottom: 4px solid var(--border);
}
.col-hd-name {
  font-size: 13px;
  font-weight: 700;
  color: #C4D5E8;
  text-align: center;
  letter-spacing: .01em;
}
.col-hd-count {
  font-size: 10px;
  color: #3D5070;
  font-weight: 600;
  background: rgba(0,0,0,.2);
  border-radius: 8px;
  padding: 0 6px;
  min-width: 16px;
  text-align: center;
}

/* Texte de l'en-tête dans la couleur du statut */
.col-hd[data-s="Backlog"]  { border-bottom-color: var(--s-backlog); }
.col-hd[data-s="Backlog"]  .col-hd-name { color: var(--s-backlog); }
.col-hd[data-s="À faire"]  { border-bottom-color: var(--s-afaire); }
.col-hd[data-s="À faire"]  .col-hd-name { color: var(--s-afaire); }
.col-hd[data-s="En cours"] { border-bottom-color: var(--s-encours); }
.col-hd[data-s="En cours"] .col-hd-name { color: var(--s-encours); }
.col-hd[data-s="En pause"] { border-bottom-color: var(--s-pause); }
.col-hd[data-s="En pause"] .col-hd-name { color: var(--s-pause); }
.col-hd[data-s="Terminé"]  { border-bottom-color: var(--s-termine); }
.col-hd[data-s="Terminé"]  .col-hd-name { color: var(--s-termine); }
.col-hd[data-s="Écarté"]   { border-bottom-color: var(--s-ecarte); }
.col-hd[data-s="Écarté"]   .col-hd-name { color: var(--s-ecarte); }

/* ── Lane labels ─────────────────────────────────────────── */
.lane-label {
  position: sticky;
  left: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  text-align: center;
  word-break: break-word;
  padding: 0 10px;
  min-height: 120px;
  border-right: 3px solid rgba(0,0,0,.1);
  border-bottom: 1px solid rgba(0,0,0,.06);
  /* couleurs overridées par ligne */
  background: #E2E8F0;
  color: #475569;
}

.lane-label[data-l="R&D"]               { background: #E5C5E2; color: #8D3F86; border-right-color: #8D3F86; }
.lane-label[data-l="POC"]               { background: #C6DCEB; color: #2D6A98; border-right-color: #2D6A98; }
.lane-label[data-l="Pilote"]            { background: #EDE7C2; color: #7A6422; border-right-color: #7A6422; }
.lane-label[data-l="Industrialisation"] { background: #BFE0D9; color: #1D6E62; border-right-color: #1D6E62; font-size: 10px; }

/* ── Lane cells ──────────────────────────────────────────── */
.cell {
  padding: 8px 7px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--bg-cell);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 120px;
  vertical-align: top;
}
.cell.occupied { background: var(--surface); }
.cell-count {
  font-size: 9px;
  color: var(--text-faint);
  font-weight: 600;
  letter-spacing: .04em;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* ── Lane pastille sur card ──────────────────────────────── */
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 4px;
}
.card-head .card-title { margin-bottom: 0; }
.lane-pill {
  font-size: 8px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  flex-shrink: 0;
  letter-spacing: .03em;
  line-height: 1.7;
  white-space: nowrap;
  margin-top: 1px;
}

/* ── Cards ───────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border-left: 3px solid #818CF8;
  padding: 9px 9px 9px 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: box-shadow .12s ease, transform .1s ease;
  position: relative;
}
.card:hover {
  box-shadow: var(--shadow-up);
  transform: translateY(-1px);
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 4px;
}
.card-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 5px;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 5px;
}
.tag {
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: var(--radius-sm);
}
.card-porteurs {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.porteur {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 10px;
  background: #F0FDF4;
  color: #166534;
  border: 1px solid #BBF7D0;
}
.av {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #15803D;
  color: #fff;
  font-size: 7px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ── Detail side panel ───────────────────────────────────── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(11,19,36,.3);
  z-index: 100;
  backdrop-filter: blur(1.5px);
}
.overlay.on { display: block; }

.panel {
  position: fixed;
  top: 0; right: -420px;
  width: 400px; height: 100vh;
  background: var(--surface);
  z-index: 101;
  box-shadow: -6px 0 28px rgba(15,25,45,.14);
  transition: right .22s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
}
.panel.on { right: 0; }

.panel-head {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.panel-bar {
  width: 4px;
  border-radius: 3px;
  flex-shrink: 0;
  align-self: stretch;
  min-height: 18px;
}
.panel-info { flex: 1; min-width: 0; }
.panel-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 7px;
}
.panel-badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 3px;
  letter-spacing: .04em;
}
.badge-rd   { background: #EDE9FE; color: #5B21B6; }
.badge-poc  { background: #E0F2FE; color: #075985; }
.badge-pil  { background: #D1FAE5; color: #065F46; }
.badge-ind  { background: #FEF3C7; color: #78350F; }
.badge-st   { background: #F1F5F9; color: #475569; }
.close {
  background: none; border: none;
  font-size: 16px; line-height: 1;
  color: var(--text-muted); cursor: pointer;
  padding: 2px; opacity: .6;
  flex-shrink: 0;
}
.close:hover { opacity: 1; }

.panel-body {
  flex: 1; overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.section-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--text-faint);
  margin-bottom: 5px;
}
.panel-desc {
  font-size: 12px;
  color: var(--text-mid);
  line-height: 1.65;
}
.panel-tags   { display: flex; flex-wrap: wrap; gap: 4px; }
.panel-porteurs { display: flex; flex-wrap: wrap; gap: 5px; }
.porteur-lg {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 12px;
  background: #F0FDF4;
  color: #166534;
  border: 1px solid #BBF7D0;
}
.av-lg {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #15803D;
  color: #fff;
  font-size: 8px;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── Empty state ─────────────────────────────────────────── */
.empty-board {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  color: var(--text-muted);
  text-align: center;
  padding: 40px;
}
.empty-board p { font-size: 13px; line-height: 1.6; }
.empty-board code {
  background: var(--bg-cell);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: monospace;
  font-size: 11px;
  color: var(--text-mid);
}

/* ── Notice banner (demo mode) ───────────────────────────── */
.demo-notice {
  position: fixed;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  border: 1px solid rgba(255,255,255,.08);
  color: #7A90AA;
  font-size: 10px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 14px;
  z-index: 50;
  pointer-events: none;
  white-space: nowrap;
}

</style>
</head>
<body>

<!-- Top bar -->
<div class="bar">
  <span class="bar-title">Portfolio Projets · Lab Innovation</span>
  <span class="bar-dot"></span>
  <span class="bar-count" id="bar-count">—</span>
  <div class="bar-lanes" id="bar-lanes">
    <span class="bar-lane"><span class="bar-lane-dot" style="background:#E5C5E2"></span>R&amp;D</span>
    <span class="bar-lane"><span class="bar-lane-dot" style="background:#C6DCEB"></span>POC</span>
    <span class="bar-lane"><span class="bar-lane-dot" style="background:#EDE7C2"></span>Pilote</span>
    <span class="bar-lane"><span class="bar-lane-dot" style="background:#BFE0D9"></span>Industrialisation</span>
  </div>
  <span class="bar-mode" id="bar-mode">Chargement…</span>
</div>

<!-- Board -->
<div class="scroll">
  <div class="board" id="board"></div>
</div>

<!-- Detail panel -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-bar" id="p-bar"></div>
    <div class="panel-info">
      <div class="panel-title" id="p-title"></div>
      <div class="panel-badges" id="p-badges"></div>
    </div>
    <button class="close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div>
      <div class="section-lbl">Description</div>
      <div class="panel-desc" id="p-desc"></div>
    </div>
    <div id="p-tags-wrap">
      <div class="section-lbl">Tags</div>
      <div class="panel-tags" id="p-tags"></div>
    </div>
    <div id="p-porteurs-wrap">
      <div class="section-lbl">Porteurs</div>
      <div class="panel-porteurs" id="p-porteurs"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   Configuration — modifiable selon vos besoins
═══════════════════════════════════════════════════════════ */
const LIGNES  = ['R&D', 'POC', 'Pilote', 'Industrialisation'];
const STATUTS = ['Backlog', 'À faire', 'En cours', 'En pause', 'Terminé', 'Écarté'];

// Palette de pastilles par ligne — extraite de l'image de référence
// bg  = fond de la pastille, text = texte, border = couleur bordure gauche card
const LANE_STYLE = {
  'R&D':              { bg: '#E5C5E2', text: '#8D3F86', border: '#8D3F86' },
  'POC':              { bg: '#C6DCEB', text: '#2D6A98', border: '#2D6A98' },
  'Pilote':           { bg: '#EDE7C2', text: '#7A6422', border: '#7A6422' },
  'Industrialisation':{ bg: '#BFE0D9', text: '#1D6E62', border: '#1D6E62' },
};
const LANE_STYLE_DEFAULT = { bg: '#E2E8F0', text: '#475569', border: '#94A3B8' };

// Palette tournante pour les tags (bg, fg)
const TAG_PALETTE = [
  ['#EDE9FE','#5B21B6'],
  ['#E0F2FE','#075985'],
  ['#D1FAE5','#065F46'],
  ['#FEF3C7','#78350F'],
  ['#FCE7F3','#831843'],
  ['#CFFAFE','#164E63'],
  ['#FEE2E2','#991B1B'],
  ['#F0FDF4','#14532D'],
];



/* ═══════════════════════════════════════════════════════════
   Construction du squelette du board
═══════════════════════════════════════════════════════════ */
function buildSkeleton() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  // Coin
  const corner = document.createElement('div');
  corner.className = 'corner';
  board.appendChild(corner);

  // En-têtes de colonnes
  STATUTS.forEach(s => {
    const h = document.createElement('div');
    h.className = 'col-hd';
    h.dataset.s = s;
    h.innerHTML = `<span class="col-hd-name">${s}</span><span class="col-hd-count" id="cnt-${uid(s)}">0</span>`;
    board.appendChild(h);
  });

  // Lignes de nage
  LIGNES.forEach(ligne => {
    const lbl = document.createElement('div');
    lbl.className = 'lane-label';
    lbl.dataset.l = ligne;
    lbl.textContent = ligne;
    board.appendChild(lbl);

    STATUTS.forEach(statut => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = cellId(ligne, statut);
      board.appendChild(cell);
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   Rendu des données
═══════════════════════════════════════════════════════════ */
function renderAll(records) {
  // Vider les cellules
  document.querySelectorAll('.cell').forEach(c => {
    c.innerHTML = '';
    c.classList.remove('occupied');
  });

  // Comptes par colonne
  const colCounts = {};
  STATUTS.forEach(s => colCounts[s] = 0);

  // Regrouper par (Ligne, Statut)
  const groups = {};
  records.forEach(r => {
    const l = str(r.Ligne), s = str(r.Statut);
    if (!LIGNES.includes(l) || !STATUTS.includes(s)) return;
    const k = l + '||' + s;
    (groups[k] = groups[k] || []).push(r);
    colCounts[s] = (colCounts[s] || 0) + 1;
  });

  // Peupler
  Object.entries(groups).forEach(([k, recs]) => {
    const [ligne, statut] = k.split('||');
    const cell = document.getElementById(cellId(ligne, statut));
    if (!cell) return;
    cell.classList.add('occupied');
    if (recs.length > 1) {
      const cnt = el('div', 'cell-count');
      cnt.textContent = recs.length + ' projets';
      cell.appendChild(cnt);
    }
    recs.forEach(r => cell.appendChild(buildCard(r)));
  });

  // Màj comptes colonnes
  STATUTS.forEach(s => {
    const badge = document.getElementById('cnt-' + uid(s));
    if (badge) badge.textContent = colCounts[s] || 0;
  });

  // Màj topbar
  document.getElementById('bar-count').textContent =
    records.length + ' projet' + (records.length > 1 ? 's' : '');
}

/* ═══════════════════════════════════════════════════════════
   Construction d'une card
═══════════════════════════════════════════════════════════ */
function buildCard(r) {
  const ligne  = str(r.Ligne);
  const lStyle = LANE_STYLE[ligne] || LANE_STYLE_DEFAULT;
  // Couleur de la bordure : champ Couleur si renseigné, sinon couleur de la ligne
  const color  = r.Couleur || lStyle.border;
  const card   = el('div', 'card');
  card.style.borderLeftColor  = color;
  card.style.backgroundColor  = hexTint(color, .05);

  // En-tête : titre + pastille ligne
  const head = el('div', 'card-head');

  const t = el('div', 'card-title');
  t.textContent = r.Titre || '(Sans titre)';
  head.appendChild(t);

  // Pastille dynamique selon la ligne
  const pill = el('span', 'lane-pill');
  pill.textContent = ligne;
  pill.style.background = lStyle.bg;
  pill.style.color      = lStyle.text;
  head.appendChild(pill);

  card.appendChild(head);

  // Description (tronquée)
  if (r.Description) {
    const d = el('div', 'card-desc');
    d.textContent = r.Description;
    card.appendChild(d);
  }

  // Tags
  const tags = list(r.Tags);
  if (tags.length) {
    const wrap = el('div', 'card-tags');
    tags.forEach(tag => {
      const chip = el('span', 'tag');
      const [bg, fg] = tagColor(tag);
      chip.style.background = bg;
      chip.style.color = fg;
      chip.textContent = tag;
      wrap.appendChild(chip);
    });
    card.appendChild(wrap);
  }

  // Porteurs
  const porteurs = list(r.Porteurs);
  if (porteurs.length) {
    const wrap = el('div', 'card-porteurs');
    porteurs.forEach(p => {
      const chip = el('span', 'porteur');
      const av = el('span', 'av');
      av.textContent = initials(p);
      chip.appendChild(av);
      chip.appendChild(document.createTextNode(p));
      wrap.appendChild(chip);
    });
    card.appendChild(wrap);
  }

  card.addEventListener('click', () => openPanel(r, color));
  return card;
}

/* ═══════════════════════════════════════════════════════════
   Panel de détail
═══════════════════════════════════════════════════════════ */
function openPanel(r, color) {
  const panel = document.getElementById('panel');
  const ov    = document.getElementById('overlay');

  document.getElementById('p-bar').style.background = color;
  document.getElementById('p-title').textContent    = r.Titre || '(Sans titre)';
  document.getElementById('p-desc').textContent     = r.Description || '—';

  // Badges
  const badges = document.getElementById('p-badges');
  badges.innerHTML = '';
  const ligne  = str(r.Ligne);
  const statut = str(r.Statut);
  if (ligne) {
    const lStyle = LANE_STYLE[ligne] || LANE_STYLE_DEFAULT;
    const b = el('span', 'badge');
    b.textContent = ligne;
    b.style.background = lStyle.bg;
    b.style.color      = lStyle.text;
    badges.appendChild(b);
  }
  if (statut) {
    const b = el('span', 'badge badge-st');
    b.textContent = statut;
    badges.appendChild(b);
  }

  // Tags
  const tagsWrap = document.getElementById('p-tags');
  tagsWrap.innerHTML = '';
  list(r.Tags).forEach(tag => {
    const chip = el('span', 'tag');
    const [bg, fg] = tagColor(tag);
    chip.style.background = bg;
    chip.style.color = fg;
    chip.textContent = tag;
    tagsWrap.appendChild(chip);
  });
  document.getElementById('p-tags-wrap').style.display =
    list(r.Tags).length ? '' : 'none';

  // Porteurs
  const porteursWrap = document.getElementById('p-porteurs');
  porteursWrap.innerHTML = '';
  list(r.Porteurs).forEach(p => {
    const chip = el('span', 'porteur-lg');
    const av = el('span', 'av-lg');
    av.textContent = initials(p);
    chip.appendChild(av);
    chip.appendChild(document.createTextNode(p));
    porteursWrap.appendChild(chip);
  });
  document.getElementById('p-porteurs-wrap').style.display =
    list(r.Porteurs).length ? '' : 'none';

  panel.classList.add('on');
  ov.classList.add('on');
}

function closePanel() {
  document.getElementById('panel').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* ═══════════════════════════════════════════════════════════
   Utilitaires
═══════════════════════════════════════════════════════════ */
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function uid(s) { return s.replace(/[^a-z0-9]/gi,'_').toLowerCase(); }
function cellId(ligne, statut) { return 'c_' + uid(ligne) + '_' + uid(statut); }
function str(v) {
  if (!v) return '';
  if (Array.isArray(v)) return String(v[0] || '').trim();
  return String(v).trim();
}
function list(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean);
  return String(v).split(/[,;]/).map(x => x.trim()).filter(Boolean);
}
function initials(name) {
  return name.split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();
}
function tagColor(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 37 + tag.charCodeAt(i)) >>> 0;
  return TAG_PALETTE[h % TAG_PALETTE.length];
}
function hexTint(hex, pct) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return `rgba(99,102,241,${pct})`;
  const [r,g,b] = [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)];
  return `rgba(${r},${g},${b},${pct})`;
}

// Lecture d'un champ insensible à la casse
// Grist peut envoyer "ligne" ou "Ligne" ou "LIGNE" selon l'ID de colonne
function getField(record, name) {
  if (record[name] !== undefined) return record[name];
  const lower = name.toLowerCase();
  for (const key of Object.keys(record)) {
    if (key.toLowerCase() === lower) return record[key];
  }
  return undefined;
}

// Normalise un enregistrement Grist vers les noms attendus
// IDs réels dans Grist : Etape, statut, Tag, Porteur, Titre, Description
function normalize(r) {
  return {
    Titre:       getField(r, 'Titre')       || getField(r, 'titre')       || '',
    Description: getField(r, 'Description') || getField(r, 'description') || '',
    Ligne:       getField(r, 'Ligne')       || getField(r, 'ligne')
                 || getField(r, 'Etape')    || getField(r, 'etape')       || '',
    Statut:      getField(r, 'Statut')      || getField(r, 'statut')      || '',
    Tags:        getField(r, 'Tags')        || getField(r, 'tags')
                 || getField(r, 'Tag')      || getField(r, 'tag')         || '',
    Porteurs:    getField(r, 'Porteurs')    || getField(r, 'porteurs')
                 || getField(r, 'Porteur')  || getField(r, 'porteur')     || '',
    Couleur:     getField(r, 'Couleur')     || getField(r, 'couleur')     || '',
  };
}

/* ═══════════════════════════════════════════════════════════
   Point d'entrée — Grist ou mode démo
═══════════════════════════════════════════════════════════ */
buildSkeleton();

const modeEl = document.getElementById('bar-mode');

if (typeof grist !== 'undefined') {
  // ── Mode Grist ──────────────────────────────────────────
  modeEl.className = 'bar-mode connected';
  modeEl.textContent = 'Grist connecté';

  // Lecture directe des enregistrements par nom de colonne
  // Les colonnes Grist doivent s'appeler exactement :
  // Titre, Description, Ligne, Statut, Tags, Porteurs, Couleur
  grist.ready({
    requiredAccess: 'read table',
    columns: [
      { name: 'Titre',       title: 'Titre du projet',  type: 'Text',       optional: false },
      { name: 'Description', title: 'Description',       type: 'Text',       optional: true  },
      { name: 'Ligne',       title: 'Ligne de nage',     type: 'Choice',     optional: false },
      { name: 'Statut',      title: 'Statut',            type: 'Choice',     optional: false },
      { name: 'Tags',        title: 'Tags',              type: 'ChoiceList', optional: true  },
      { name: 'Porteurs',    title: 'Porteurs',          type: 'ChoiceList', optional: true  },
      { name: 'Couleur',     title: 'Couleur (hex)',     type: 'Text',       optional: true  },
    ]
  });

  grist.onRecords(function(records, mappings) {
    const data = records.map(r => {
      const mapped = mappings ? grist.mapColumnNames(r, mappings) : r;
      return mapped ? normalize(mapped) : normalize(r);
    });
    renderAll(data);
  });

} else {
  // ── Hors Grist : board vide ─────────────────────────────
  modeEl.className = 'bar-mode demo';
  modeEl.textContent = 'Hors Grist';

  const notice = document.createElement('div');
  notice.className = 'demo-notice';
  notice.textContent = 'À intégrer comme widget personnalisé dans Grist';
  document.body.appendChild(notice);

  renderAll([]);
}
</script>
