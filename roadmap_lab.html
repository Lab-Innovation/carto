<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap Projets – Lab Innovation</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js" onerror="window._noGrist=true"></script>
<style>

/* ── Tokens ──────────────────────────────────────────────── */
:root {
  --bar-h:    46px;
  --head-h:   48px;
  --card-h:   60px;
  --card-gap: 7px;
  --lane-pad: 10px;

  --navy:      #1B2A4A;
  --navy-mid:  #243659;
  --border:    #D4DEED;
  --bg:        #EBF0F6;
  --surface:   #FFFFFF;
  --text:      #0F1923;
  --text-mid:  #3D4E66;
  --text-muted:#7A90AA;
  --text-faint:#A8BCCC;
  --grid-line: rgba(180,200,220,.5);

  --s-backlog: #94A3B8;
  --s-afaire:  #3B82F6;
  --s-encours: #F97316;
  --s-pause:   #EC4899;
  --s-termine: #84CC16;
  --s-ecarte:  #EF4444;

  --shadow:    0 1px 2px rgba(15,25,45,.08), 0 1px 6px rgba(15,25,45,.04);
  --shadow-up: 0 4px 18px rgba(15,25,45,.13);
  --radius:    5px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Topbar ──────────────────────────────────────────────── */
.bar {
  height: var(--bar-h);
  background: var(--navy);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  flex-shrink: 0;
}
.bar-title { font-size: 15px; font-weight: 700; color: #D6E1F0; letter-spacing: .01em; }
.bar-dot   { width: 3px; height: 3px; border-radius: 50%; background: #3D5070; }
.bar-sub   { font-size: 11px; color: #7A90AA; }
.bar-mode  { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: 600; letter-spacing: .03em; }
.bar-mode.connected { background: rgba(16,185,129,.15); color: #6EE7B7; }
.bar-mode.offline   { background: rgba(245,158,11,.12);  color: #FCD34D; }

/* ── Scroll wrapper ──────────────────────────────────────── */
.scroll { flex: 1; overflow: auto; position: relative; }

/* ── Timeline container ──────────────────────────────────── */
.timeline { min-width: 900px; width: 100%; }

/* ── Month header ────────────────────────────────────────── */
.tl-head {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--navy-mid);
  border-bottom: 2px solid var(--navy);
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  height: var(--head-h);
}
.month-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #8FA8C4;
  border-right: 1px solid rgba(255,255,255,.06);
  letter-spacing: .02em;
}
.month-cell.current { color: #FBBF24; }
.month-cell:last-child { border-right: none; }

/* ── Today marker (shown via JS) ────────────────────────── */
.today-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: #FBBF24;
  opacity: .7;
  pointer-events: none;
  z-index: 10;
}
.today-label {
  position: absolute;
  top: 4px;
  background: #FBBF24;
  color: #1B2A4A;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
  z-index: 11;
}

/* ── Lane section ────────────────────────────────────────── */
.lane-section { border-bottom: 2px solid var(--border); }

.lane-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px 8px;
  border-bottom: 1px solid rgba(0,0,0,.06);
  position: relative;
}
.lane-header-name {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -.01em;
}
.lane-header-count {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  opacity: .7;
}
.lane-header-line {
  flex: 1;
  height: 1px;
  opacity: .25;
  background: currentColor;
}

/* Lane header per-lane palette */
.lane-header[data-l="R&D"]               { background: #F5EEF4; color: #8D3F86; }
.lane-header[data-l="POC"]               { background: #EDF3F8; color: #2D6A98; }
.lane-header[data-l="Pilote"]            { background: #F7F5EA; color: #7A6422; }
.lane-header[data-l="Production"]        { background: #ECF5F3; color: #1D6E62; }
.lane-header[data-l="Industrialisé"]     { background: #ECF5F3; color: #1D6E62; }
.lane-header[data-l="Industrialisation"] { background: #ECF5F3; color: #1D6E62; }

/* ── Cards area ──────────────────────────────────────────── */
.cards-area {
  position: relative;
  padding: var(--lane-pad) 0;
  min-height: calc(var(--card-h) + var(--lane-pad) * 2 + 20px);
}

/* Gridlines: 12 vertical bands via CSS, one per month */
.gridline {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--grid-line);
  pointer-events: none;
}

/* ── Cards ───────────────────────────────────────────────── */
.card {
  position: absolute;
  min-height: var(--card-h);
  background: #FFFFFF;
  border-radius: var(--radius);
  border-top: 4px solid #818CF8;
  border-left: none;
  box-shadow: 0 1px 3px rgba(15,25,45,.12), 0 2px 8px rgba(15,25,45,.08);
  cursor: pointer;
  overflow: hidden;
  transition: box-shadow .12s ease, transform .1s ease;
  display: flex;
  flex-direction: column;
}
.card:hover {
  box-shadow: var(--shadow-up);
  transform: translateY(-1px);
  z-index: 5;
}

/* Bandeau En pause */
.card-pause-banner {
  background: #FC8171;
  padding: 4px 9px;
  flex-shrink: 0;
}
.card-pause-line1 {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 1px;
}
.card-pause-label {
  font-size: 9px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .04em;
}
.card-pause-cause {
  font-size: 9px;
  color: rgba(255,255,255,.88);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Corps de la card */
.card-body {
  padding: 7px 9px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
}

.card-row1 {
  display: flex;
  align-items: center;
  gap: 5px;
  overflow: hidden;
}
.card-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.card.is-pause .card-title { color: #8A96A3; }
.card.is-pause .card-desc  { color: #A8B4BE; }

.card-statut {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
  white-space: nowrap;
}
.st-Backlog  { background:#F1F5F9; color:var(--s-backlog); }
.st-Afaire   { background:#EFF6FF; color:var(--s-afaire);  }
.st-Encours  { background:#FFF7ED; color:var(--s-encours); }
.st-Pause    { background:#FDF2F8; color:var(--s-pause);   }
.st-Termine  { background:#F7FEE7; color:var(--s-termine); }
.st-Ecarte   { background:#FEF2F2; color:var(--s-ecarte);  }

.card-row2 {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
}
.card-desc {
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.card-tags {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.tag {
  font-size: 8px;
  font-weight: 600;
  padding: 1px 4px;
  border-radius: 2px;
  white-space: nowrap;
}

/* Porteurs — option B : icône + noms en gras dans la couleur de la lane */
.card-row3 {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  border-top: 1.5px solid #E8ECF0;
  padding-top: 4px;
  margin-top: 2px;
}
.card-porteur-icon { flex-shrink: 0; }
.card-porteur-names {
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.card.is-pause .card-porteur-names { color: #8A96A3 !important; }

.card-dates {
  font-size: 9px;
  color: var(--text-faint);
  margin-left: auto;
  flex-shrink: 0;
  white-space: nowrap;
}

/* Narrow cards — masquer description/tags ET dates, GARDER titre + statut + porteurs */
.card.narrow .card-row2  { display: none; }
.card.narrow .card-dates { display: none; }
/* Tiny cards — idem */
.card.tiny   .card-row2  { display: none; }
.card.tiny   .card-dates { display: none; }
/* Micro cards (< 50px) — juste le titre tronqué */
.card.micro  .card-row2  { display: none; }
.card.micro  .card-row3  { display: none; }
.card.micro  .card-statut { display: none; }

/* ── Empty lane ──────────────────────────────────────────── */
.lane-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 60px;
  font-size: 12px;
  color: var(--text-faint);
  font-style: italic;
}

/* ── Detail panel (identical au kanban) ─────────────────── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(11,19,36,.3);
  z-index: 100;
  backdrop-filter: blur(1.5px);
}
.overlay.on { display: block; }

.panel {
  position: fixed;
  top: 0; right: -420px;
  width: 400px; height: 100vh;
  background: var(--surface);
  z-index: 101;
  box-shadow: -6px 0 28px rgba(15,25,45,.14);
  transition: right .22s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
}
.panel.on { right: 0; }
.panel-head {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.panel-bar { width: 4px; border-radius: 3px; flex-shrink: 0; align-self: stretch; min-height: 18px; }
.panel-info { flex: 1; min-width: 0; }
.panel-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 7px; }
.panel-badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; }
.badge-st { background: #F1F5F9; color: #475569; }
.close { background: none; border: none; font-size: 16px; line-height: 1; color: var(--text-muted); cursor: pointer; padding: 2px; opacity: .6; flex-shrink: 0; }
.close:hover { opacity: 1; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.section-lbl { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 5px; }
.panel-desc { font-size: 12px; color: var(--text-mid); line-height: 1.65; }
.panel-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.panel-porteurs { display: flex; flex-wrap: wrap; gap: 5px; }
.porteur-lg { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 12px; background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }
.av-lg { width: 18px; height: 18px; border-radius: 50%; background: #15803D; color: #fff; font-size: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.panel-dates { display: flex; gap: 16px; }
.panel-date-item { display: flex; flex-direction: column; gap: 2px; }
.panel-date-lbl { font-size: 9px; color: var(--text-faint); font-weight: 600; letter-spacing: .04em; }
.panel-date-val { font-size: 13px; font-weight: 700; color: var(--text); }

/* ── Notice ──────────────────────────────────────────────── */
.notice {
  position: fixed; bottom: 14px; left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  border: 1px solid rgba(255,255,255,.08);
  color: #7A90AA;
  font-size: 10px; font-weight: 500;
  padding: 6px 16px; border-radius: 14px;
  z-index: 50; pointer-events: none; white-space: nowrap;
}

/* ── Barre de contrôle période ───────────────────────────── */
.ctrl-bar {
  height: 40px;
  background: #E8EDF3;
  border-bottom: 1px solid #C8D4E0;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
  flex-shrink: 0;
}
.ctrl-label {
  font-size: 12px;
  color: #2D3F55;
  font-weight: 700;
  white-space: nowrap;
}
.ctrl-sep { font-size: 16px; color: #4A6080; font-weight: 700; }
.ctrl-bar select {
  background: #fff;
  border: 1px solid #B0BEC8;
  border-radius: 4px;
  color: #1B2A4A;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  padding: 3px 6px;
  height: 26px;
  cursor: pointer;
  outline: none;
}
.ctrl-bar select:hover { border-color: #7A90AA; }
.ctrl-bar select:focus { border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59,130,246,.15); }
.ctrl-reset {
  background: #fff;
  border: 1px solid #B0BEC8;
  border-radius: 4px;
  color: #2D3F55;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  padding: 2px 10px;
  cursor: pointer;
  height: 26px;
}
.ctrl-reset:hover { background: #f0f4f8; border-color: #7A90AA; }
.ctrl-info {
  margin-left: auto;
  font-size: 11px;
  color: #7A90AA;
  font-weight: 500;
}

</style>
</head>
<body>

<div class="bar">
  <span class="bar-title">Roadmap Projets · Lab Innovation</span>
  <span class="bar-dot"></span>
  <span class="bar-sub" id="bar-period">—</span>
  <span class="bar-dot"></span>
  <span class="bar-sub" id="bar-count">—</span>
  <span class="bar-mode" id="bar-mode">Chargement…</span>
</div>

<div class="ctrl-bar">
  <span class="ctrl-label">Période</span>
  <select id="ctrl-sm"></select>
  <select id="ctrl-sy"></select>
  <span class="ctrl-sep">→</span>
  <select id="ctrl-em"></select>
  <select id="ctrl-ey"></select>
  <button class="ctrl-reset" onclick="resetPeriod()">Réinitialiser</button>
  <span class="ctrl-info" id="ctrl-info"></span>
</div>

<div class="scroll" id="scroll">
  <div class="timeline" id="timeline">
    <!-- Généré par JS -->
  </div>
</div>

<!-- Detail panel -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-bar" id="p-bar"></div>
    <div class="panel-info">
      <div class="panel-title" id="p-title"></div>
      <div class="panel-badges" id="p-badges"></div>
    </div>
    <button class="close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div id="p-cause-wrap" style="display:none;">
      <div class="section-lbl">Cause de la pause</div>
      <div style="background:#FEF2F2;border-left:3px solid #FC8171;border-radius:4px;padding:8px 10px;font-size:12px;color:#7F1D1D;line-height:1.5;" id="p-cause"></div>
    </div>
    <div id="p-dates-wrap">
      <div class="section-lbl">Calendrier</div>
      <div class="panel-dates">
        <div class="panel-date-item">
          <span class="panel-date-lbl">DÉBUT</span>
          <span class="panel-date-val" id="p-debut">—</span>
        </div>
        <div class="panel-date-item">
          <span class="panel-date-lbl">FIN</span>
          <span class="panel-date-val" id="p-fin">—</span>
        </div>
      </div>
    </div>
    <div>
      <div class="section-lbl">Description</div>
      <div class="panel-desc" id="p-desc"></div>
    </div>
    <div id="p-tags-wrap">
      <div class="section-lbl">Tags</div>
      <div class="panel-tags" id="p-tags"></div>
    </div>
    <div id="p-porteurs-wrap">
      <div class="section-lbl">Porteurs</div>
      <div class="panel-porteurs" id="p-porteurs"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   Configuration timeline
═══════════════════════════════════════════════════ */
const FR_MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const DEFAULT_START = '2026-09';
const DEFAULT_END   = '2027-08';

let TSTART, TEND, TSPAN, MONTHS, MONTH_DATES;

function parsePeriod(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1);
}

function buildTimeline(startYM, endYM) {
  TSTART = parsePeriod(startYM);
  // TEND = premier jour du mois SUIVANT le mois de fin
  const [ey, em] = endYM.split('-').map(Number);
  TEND   = new Date(ey, em, 1);
  TSPAN  = TEND - TSTART;

  MONTHS = []; MONTH_DATES = [];
  let cur = new Date(TSTART);
  while (cur < TEND) {
    MONTHS.push(FR_MONTHS[cur.getMonth()] + ' ' + String(cur.getFullYear()).slice(2));
    MONTH_DATES.push(new Date(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  // Topbar période
  const s = FR_MONTHS[TSTART.getMonth()] + ' ' + TSTART.getFullYear();
  const e = FR_MONTHS[new Date(TEND.getFullYear(), TEND.getMonth()-1, 1).getMonth()] + ' ' + new Date(TEND.getFullYear(), TEND.getMonth()-1, 1).getFullYear();
  document.getElementById('bar-period').textContent = s + ' – ' + e;
  // Info nb mois
  document.getElementById('ctrl-info').textContent = MONTHS.length + ' mois';
}

function loadPeriod() {
  buildSelects();
  let s = DEFAULT_START, e = DEFAULT_END;
  try { s = localStorage.getItem('roadmap_start') || DEFAULT_START; } catch(_) {}
  try { e = localStorage.getItem('roadmap_end')   || DEFAULT_END;   } catch(_) {}
  setSelValues(s, e);
  buildTimeline(s, e);
}

function savePeriod(s, e) {
  try { localStorage.setItem('roadmap_start', s); localStorage.setItem('roadmap_end', e); } catch(_) {}
}

function resetPeriod() {
  setSelValues(DEFAULT_START, DEFAULT_END);
  buildTimeline(DEFAULT_START, DEFAULT_END);
  savePeriod(DEFAULT_START, DEFAULT_END);
  if (lastRecords) render(lastRecords);
}

const MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const ANNEES  = [2025, 2026, 2027, 2028, 2029];

function buildSelects() {
  ['ctrl-sm','ctrl-em'].forEach(id => {
    const sel = document.getElementById(id);
    MOIS_FR.forEach((m,i) => {
      const o = document.createElement('option');
      o.value = String(i+1).padStart(2,'0');
      o.textContent = m;
      sel.appendChild(o);
    });
  });
  ['ctrl-sy','ctrl-ey'].forEach(id => {
    const sel = document.getElementById(id);
    ANNEES.forEach(y => {
      const o = document.createElement('option');
      o.value = y;
      o.textContent = y;
      sel.appendChild(o);
    });
  });
}

function getSelValues() {
  const sm = document.getElementById('ctrl-sm').value;
  const sy = document.getElementById('ctrl-sy').value;
  const em = document.getElementById('ctrl-em').value;
  const ey = document.getElementById('ctrl-ey').value;
  return { start: sy + '-' + sm, end: ey + '-' + em };
}

function setSelValues(startYM, endYM) {
  const [sy,sm] = startYM.split('-');
  const [ey,em] = endYM.split('-');
  document.getElementById('ctrl-sm').value = sm;
  document.getElementById('ctrl-sy').value = sy;
  document.getElementById('ctrl-em').value = em;
  document.getElementById('ctrl-ey').value = ey;
}

function onSelChange() {
  const { start, end } = getSelValues();
  if (start <= end) { buildTimeline(start, end); savePeriod(start, end); if (lastRecords) render(lastRecords); }
}

['ctrl-sm','ctrl-sy','ctrl-em','ctrl-ey'].forEach(id => {
  document.getElementById(id).addEventListener('change', onSelChange);
});

let lastRecords = null;

const LIGNES  = ['R&D', 'POC', 'Pilote', 'Production'];

const LANE_STYLE = {
  'R&D':              { bg: '#E5C5E2', text: '#8D3F86' },
  'POC':              { bg: '#C6DCEB', text: '#2D6A98' },
  'Pilote':           { bg: '#EDE7C2', text: '#7A6422' },
  'Production':       { bg: '#BFE0D9', text: '#1D6E62' },
  'Industrialisé':    { bg: '#BFE0D9', text: '#1D6E62' }, // rétrocompat
  'Industrialisation':{ bg: '#BFE0D9', text: '#1D6E62' }, // rétrocompat
};
const LANE_DEFAULT = { bg: '#E2E8F0', text: '#475569' };

const TAG_PALETTE = [
  ['#EDE9FE','#5B21B6'],['#E0F2FE','#075985'],['#D1FAE5','#065F46'],
  ['#FEF3C7','#78350F'],['#FCE7F3','#831843'],['#CFFAFE','#164E63'],
  ['#FEE2E2','#991B1B'],['#F0FDF4','#14532D'],
];

const CARD_H      = 68;  // card normale
const CARD_H_PAUSE = 90; // card En pause (bandeau + contenu)
const CARD_GAP = 7;
const LANE_PAD = 10;

/* ═══════════════════════════════════════════════════
   Utilitaires
═══════════════════════════════════════════════════ */
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function str(v) { if (!v) return ''; if (Array.isArray(v)) return String(v[0] || '').trim(); return String(v).trim(); }
function list(v) { if (!v) return []; if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean); return String(v).split(/[,;]/).map(x => x.trim()).filter(Boolean); }
function initials(n) { return n.split(/\s+/).slice(0,2).map(w => w[0]||'').join('').toUpperCase(); }
function tagColor(t) { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 37 + t.charCodeAt(i)) >>> 0; return TAG_PALETTE[h % TAG_PALETTE.length]; }
function hexTint(hex, a) { const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); if (!m) return `rgba(99,102,241,${a})`; return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`; }

function parseDate(s) {
  if (!s && s !== 0) return null;
  // Grist type Date envoie un timestamp en secondes (pas millisecondes)
  if (typeof s === 'number') return new Date(s * 1000);
  const str = String(s).trim();
  if (!str) return null;
  // YYYY-MM-DD
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  // DD/MM/YYYY ou DD-MM-YYYY
  m = /^(\d{2})[\/\-](\d{2})[\/\-](\d{4})/.exec(str);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}
function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function toPct(d) {
  if (!d) return null;
  return Math.max(0, Math.min(100, (d - TSTART) / TSPAN * 100));
}

function getField(r, name) {
  if (r[name] !== undefined) return r[name];
  const l = name.toLowerCase();
  for (const k of Object.keys(r)) { if (k.toLowerCase() === l) return r[k]; }
  return undefined;
}
function normalize(r) {
  return {
    Titre:       str(getField(r,'Titre')       || getField(r,'titre')      || ''),
    Description: str(getField(r,'Description') || getField(r,'description')|| ''),
    Ligne: str(getField(r,'Ligne')  || getField(r,'ligne')
            || getField(r,'Etape') || getField(r,'etape') || '')
           .replace('Industrialisation','Production')
           .replace('Industrialisé','Production'),
    Statut:      str(getField(r,'Statut')      || getField(r,'statut')     || ''),
    Tags:        getField(r,'Tags')   || getField(r,'tags')   || getField(r,'Tag') || getField(r,'tag') || '',
    Porteurs:    getField(r,'Porteurs')|| getField(r,'porteurs')|| getField(r,'Porteur')|| getField(r,'porteur')|| '',
    Couleur:     str(getField(r,'Couleur')     || getField(r,'couleur')    || ''),
    Date_debut:  getField(r,'Date_debut')     || getField(r,'date_debut')
              || getField(r,'Date de début')  || getField(r,'date de début')
              || getField(r,'Date_de_début')  || getField(r,'date_de_debut')
              || getField(r,'Date_de_debut')  || getField(r,'date_de_d_but')
              || getField(r,'Debut')          || getField(r,'debut')          || null,
    Date_fin:   getField(r,'Date_fin')        || getField(r,'date_fin')
              || getField(r,'Date de fin')    || getField(r,'date de fin')
              || getField(r,'Date_de_fin')    || getField(r,'date_de_fin')
              || getField(r,'Fin')            || getField(r,'fin')            || null,
    Cause_pause: str(getField(r,'Cause_pause') || getField(r,'cause_pause')
              || getField(r,'Cause pause')    || getField(r,'cause pause')    || ''),
  };
}

/* ═══════════════════════════════════════════════════
   Assignation de tracks (évite les chevauchements)
═══════════════════════════════════════════════════ */
function assignTracks(cards) {
  const sorted = [...cards].sort((a, b) => {
    const da = a._debut || TSTART;
    const db = b._debut || TSTART;
    return da - db;
  });
  const rowEnds  = [];
  const rowH     = []; // hauteur max de chaque row
  return sorted.map(card => {
    const debut  = card._debut || TSTART;
    const fin    = card._fin   || TEND;
    const isPause = card.Statut === 'En pause';
    const cardH  = isPause ? CARD_H_PAUSE : CARD_H;
    let row = rowEnds.findIndex(end => end <= debut);
    if (row === -1) { row = rowEnds.length; rowEnds.push(fin); rowH.push(cardH); }
    else { rowEnds[row] = fin; rowH[row] = Math.max(rowH[row], cardH); }
    return { ...card, _row: row, _cardH: cardH, _rowH: rowH };
  });
}

/* ═══════════════════════════════════════════════════
   Construction du statut CSS class
═══════════════════════════════════════════════════ */
function statutClass(s) {
  const map = { 'Backlog':'Backlog','À faire':'Afaire','En cours':'Encours','En pause':'Pause','Terminé':'Termine','Écarté':'Ecarte' };
  return 'st-' + (map[s] || 'Backlog');
}

/* ═══════════════════════════════════════════════════
   Rendu principal
═══════════════════════════════════════════════════ */
function render(records) {
  lastRecords = records;
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  // ── En-tête des mois (sticky) ──
  const head = el('div','tl-head');
  const today = new Date();
  MONTHS.forEach((label, i) => {
    const c = el('div','month-cell');
    const mDate = MONTH_DATES[i];
    if (today >= mDate && (i === 11 || today < MONTH_DATES[i+1])) c.classList.add('current');
    c.textContent = label;
    head.appendChild(c);
  });
  tl.appendChild(head);

  // ── Grouper par ligne ──
  const groups = {};
  LIGNES.forEach(l => groups[l] = []);
  records.forEach(r => {
    const l = r.Ligne;
    if (!groups[l]) return;
    const debut = parseDate(r.Date_debut);
    const fin   = parseDate(r.Date_fin);
    groups[l].push({ ...r, _debut: debut, _fin: fin });
  });

  let total = 0;

  LIGNES.forEach(ligne => {
    const cards = groups[ligne];
    total += cards.length;
    const ls = LANE_STYLE[ligne] || LANE_DEFAULT;

    // Section wrapper
    const section = el('div','lane-section');

    // Header de ligne
    const hdr = el('div','lane-header');
    hdr.dataset.l = ligne;
    const name = el('span','lane-header-name');
    name.textContent = ligne;
    const count = el('span','lane-header-count');
    count.textContent = cards.length + ' projet' + (cards.length > 1 ? 's' : '');
    count.style.background = ls.bg;
    count.style.color = ls.text;
    const line = el('span','lane-header-line');
    hdr.appendChild(name);
    hdr.appendChild(count);
    hdr.appendChild(line);
    section.appendChild(hdr);

    // Zone de cards avec fond légèrement teinté par la couleur de la lane
    const area = el('div','cards-area');
    area.style.backgroundColor = hexTint(ls.bg, 0.22);

    if (cards.length === 0) {
      const empty = el('div','lane-empty');
      empty.textContent = 'Aucun projet — ajoutez une ligne dans votre table Grist';
      area.appendChild(empty);
      section.appendChild(area);
      tl.appendChild(section);
      return;
    }

    // Gridlines verticales (1 par mois + fin)
    for (let i = 0; i <= 12; i++) {
      const gl = el('div','gridline');
      gl.style.left = (i / 12 * 100) + '%';
      area.appendChild(gl);
    }

    // Today line
    const todayPct = toPct(today);
    if (todayPct !== null && todayPct > 0 && todayPct < 100) {
      const tl_line = el('div','today-line');
      tl_line.style.left = todayPct + '%';
      area.appendChild(tl_line);
    }

    // Assigner les tracks
    const tracked = assignTracks(cards);
    const maxRow  = tracked.reduce((m, c) => Math.max(m, c._row), 0);
    // Hauteur de chaque row = max card height dans ce row
    const rowHeights = [];
    tracked.forEach(c => {
      rowHeights[c._row] = Math.max(rowHeights[c._row] || 0, c._cardH);
    });
    const areaH = rowHeights.reduce((sum, h) => sum + h + CARD_GAP, LANE_PAD * 2);
    area.style.height = areaH + 'px';

    tracked.forEach(r => {
      const debut    = r._debut;
      const fin      = r._fin;
      const hasDate  = debut && fin;
      const isPause  = r.Statut === 'En pause';

      // Position horizontale
      const leftPct  = hasDate ? toPct(debut) : 0;
      const rightPct = hasDate ? toPct(fin)   : 15;
      const widthPct = Math.max(0.5, rightPct - leftPct);

      // Position verticale (cumul des rows précédents)
      let top = LANE_PAD;
      for (let i = 0; i < r._row; i++) top += (rowHeights[i] || CARD_H) + CARD_GAP;

      const lStyle = LANE_STYLE[r.Ligne] || LANE_DEFAULT;
      const color  = r.Couleur || lStyle.text;

      const card = el('div', isPause ? 'card is-pause' : 'card');
      card.style.left       = leftPct + '%';
      card.style.width      = widthPct + '%';
      card.style.top        = top + 'px';
      card.style.height     = r._cardH + 'px';
      card.style.borderTopColor = color;

      const approxW = (widthPct / 100) * (window.innerWidth || 1000);
      if (approxW < 50)       card.classList.add('micro');
      else if (approxW < 120) card.classList.add('tiny');
      else if (approxW < 220) card.classList.add('narrow');

      // ── Bandeau "En pause" ──
      if (isPause) {
        const banner = el('div','card-pause-banner');
        const line1  = el('div','card-pause-line1');
        const iconSvg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        iconSvg.setAttribute('width','11'); iconSvg.setAttribute('height','11');
        iconSvg.setAttribute('viewBox','0 0 24 24'); iconSvg.setAttribute('fill','none');
        iconSvg.setAttribute('stroke','#fff'); iconSvg.setAttribute('stroke-width','2.5');
        iconSvg.setAttribute('stroke-linecap','round'); iconSvg.setAttribute('stroke-linejoin','round');
        iconSvg.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        const lbl = el('span','card-pause-label'); lbl.textContent = 'En pause';
        line1.appendChild(iconSvg); line1.appendChild(lbl);
        banner.appendChild(line1);
        if (r.Cause_pause) {
          const cause = el('div','card-pause-cause');
          cause.textContent = r.Cause_pause;
          banner.appendChild(cause);
        }
        card.appendChild(banner);
      }

      // ── Corps de la card ──
      const body = el('div','card-body');

      // Row 1: titre + badge statut (pas de pastille lane, redondant dans roadmap)
      const row1 = el('div','card-row1');
      const title = el('div','card-title');
      title.textContent = r.Titre || '(Sans titre)';
      row1.appendChild(title);
      if (r.Statut && !isPause) {
        const st = el('span','card-statut ' + statutClass(r.Statut));
        st.textContent = r.Statut;
        row1.appendChild(st);
      }
      body.appendChild(row1);

      // Row 2: description + tags
      const row2 = el('div','card-row2');
      if (r.Description) {
        const desc = el('div','card-desc'); desc.textContent = r.Description;
        row2.appendChild(desc);
      }
      const tags = list(r.Tags);
      if (tags.length) {
        const tw = el('div','card-tags');
        tags.slice(0,3).forEach(t => {
          const chip = el('span','tag');
          const [bg,fg] = isPause ? ['#EDF2F7','#8A96A3'] : tagColor(t);
          chip.style.background = bg; chip.style.color = fg;
          chip.textContent = t; tw.appendChild(chip);
        });
        row2.appendChild(tw);
      }
      body.appendChild(row2);

      // Row 3: porteurs option B + dates
      const row3 = el('div','card-row3');
      const porteurs = list(r.Porteurs);
      if (porteurs.length) {
        // Icône personne SVG
        const iconP = document.createElementNS('http://www.w3.org/2000/svg','svg');
        iconP.setAttribute('width','11'); iconP.setAttribute('height','11');
        iconP.setAttribute('viewBox','0 0 24 24'); iconP.setAttribute('fill','none');
        iconP.setAttribute('stroke', isPause ? '#8A96A3' : lStyle.text);
        iconP.setAttribute('stroke-width','2.5');
        iconP.setAttribute('stroke-linecap','round'); iconP.setAttribute('stroke-linejoin','round');
        iconP.innerHTML = '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>';
        iconP.classList.add('card-porteur-icon');
        row3.appendChild(iconP);
        // Noms séparés par ·
        const names = el('span','card-porteur-names');
        names.style.color = isPause ? '#8A96A3' : lStyle.text;
        names.textContent = porteurs.slice(0,3).join(' · ');
        row3.appendChild(names);
      }
      if (hasDate) {
        const dates = el('span','card-dates');
        dates.textContent = fmtDate(debut) + ' → ' + fmtDate(fin);
        row3.appendChild(dates);
      }
      body.appendChild(row3);

      card.appendChild(body);
      card.addEventListener('click', () => openPanel(r, color));
      area.appendChild(card);
    });

    section.appendChild(area);
    tl.appendChild(section);
  });

  document.getElementById('bar-count').textContent = total + ' projet' + (total > 1 ? 's' : '');
}

/* ═══════════════════════════════════════════════════
   Panel de détail
═══════════════════════════════════════════════════ */
function openPanel(r, color) {
  const ls = LANE_STYLE[r.Ligne] || LANE_DEFAULT;

  document.getElementById('p-bar').style.background = color;
  document.getElementById('p-title').textContent    = r.Titre || '(Sans titre)';
  document.getElementById('p-desc').textContent     = r.Description || '—';

  // Badges
  const badges = document.getElementById('p-badges');
  badges.innerHTML = '';
  if (r.Ligne) {
    const b = el('span','badge');
    b.textContent = r.Ligne;
    b.style.background = ls.bg;
    b.style.color = ls.text;
    badges.appendChild(b);
  }
  if (r.Statut) {
    const b = el('span','badge badge-st');
    b.textContent = r.Statut;
    badges.appendChild(b);
  }

  // Cause pause (visible seulement si En pause + cause renseignée)
  const causeWrap = document.getElementById('p-cause-wrap');
  const causeEl   = document.getElementById('p-cause');
  if (r.Statut === 'En pause' && r.Cause_pause) {
    causeEl.textContent = r.Cause_pause;
    causeWrap.style.display = '';
  } else {
    causeWrap.style.display = 'none';
  }

  // Dates
  document.getElementById('p-debut').textContent = fmtDate(r._debut || parseDate(r.Date_debut));
  document.getElementById('p-fin').textContent   = fmtDate(r._fin   || parseDate(r.Date_fin));

  // Tags
  const tagsEl = document.getElementById('p-tags');
  tagsEl.innerHTML = '';
  list(r.Tags).forEach(t => {
    const chip = el('span','tag');
    const [bg,fg] = tagColor(t);
    chip.style.background = bg; chip.style.color = fg;
    chip.style.fontSize = '11px'; chip.style.padding = '2px 6px';
    chip.textContent = t;
    tagsEl.appendChild(chip);
  });
  document.getElementById('p-tags-wrap').style.display = list(r.Tags).length ? '' : 'none';

  // Porteurs
  const porteursEl = document.getElementById('p-porteurs');
  porteursEl.innerHTML = '';
  list(r.Porteurs).forEach(p => {
    const chip = el('span','porteur-lg');
    const av = el('span','av-lg');
    av.textContent = initials(p);
    chip.appendChild(av);
    chip.appendChild(document.createTextNode(p));
    porteursEl.appendChild(chip);
  });
  document.getElementById('p-porteurs-wrap').style.display = list(r.Porteurs).length ? '' : 'none';

  document.getElementById('panel').classList.add('on');
  document.getElementById('overlay').classList.add('on');
}

function closePanel() {
  document.getElementById('panel').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* ═══════════════════════════════════════════════════
   Grist
═══════════════════════════════════════════════════ */
const modeEl = document.getElementById('bar-mode');

loadPeriod();

if (typeof grist !== 'undefined') {
  modeEl.className = 'bar-mode connected';
  modeEl.textContent = 'Grist connecté';
  grist.ready({ requiredAccess: 'read table' });
  grist.onRecords(function(records) {
    render(records.map(normalize));
  });
} else {
  modeEl.className = 'bar-mode offline';
  modeEl.textContent = 'Hors Grist';
  const notice = document.createElement('div');
  notice.className = 'notice';
  notice.textContent = 'À intégrer comme widget personnalisé dans Grist';
  document.body.appendChild(notice);
  render([]);
}
</script>
</body>
